name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev nodejs npm

      - name: Clone Your Repository
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt

      - name: Migrate DTS to New Architecture
        run: |
          cd openwrt
          echo "=== 自动将 DTS 迁移至 UNIPHY/DWMAC 架构 ==="
          
          DTS_DIR="target/linux/qualcommax/files/arch/arm64/boot/dts/qcom"
          if [ -d "target/linux/qualcommax/dts" ]; then
            DTS_DIR="target/linux/qualcommax/dts"
          fi
          
          DTS_FILE="$DTS_DIR/ipq5018-rg-ma3063.dts"
          
          if [ ! -f "$DTS_FILE" ]; then
            echo "❌ 错误：未找到 $DTS_FILE"
            exit 1
          fi
          
          # 1. 确保包含必要的头文件
          if ! grep -q '#include <dt-bindings/net/qcom-ipq-ess.h>' "$DTS_FILE"; then
            sed -i '1i #include <dt-bindings/net/qcom-ipq-ess.h>' "$DTS_FILE"
          fi
          
          # 2. 关键替换：将旧的 switch 节点替换为新的 uniphy0 节点
          sed -i 's/&switch/&uniphy0/g' "$DTS_FILE"
          
          # 3. 关键替换：将旧的 dp1/dp2 节点替换为新的 gmac0/gmac1 节点
          sed -i 's/&dp1/&gmac0/g' "$DTS_FILE"
          sed -i 's/&dp2/&gmac1/g' "$DTS_FILE"
          
          # 4. 在 gmac 节点内补充必要的 nvmem-cells 引用（可选，但通常需要）
          sed -i '/&gmac0 {/a\          nvmem-cells = <&mac_addr_gmac0 0>;\n          nvmem-cell-names = "mac-address";' "$DTS_FILE"
          sed -i '/&gmac1 {/a\          nvmem-cells = <&mac_addr_gmac1 0>;\n          nvmem-cell-names = "mac-address";' "$DTS_FILE"
          
          echo "✅ DTS 迁移完成。"
          echo "=== 修改后的 DTS 片段（用于核对）==="
          grep -A 5 "&uniphy0" "$DTS_FILE" || true
          grep -A 5 "&gmac0" "$DTS_FILE" || true
          grep -A 5 "&gmac1" "$DTS_FILE" || true

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          make defconfig
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j1 V=s > build.log 2>&1 || true
          
          if ls bin/targets/qualcommax/ipq50xx/*ruijie_rg-ma3063*.bin 1> /dev/null 2>&1; then
            echo "✅ 编译成功！固件已生成。"
          else
            echo "❌ 编译失败，以下是最后 200 行日志："
            tail -n 200 build.log
            exit 1
          fi

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Ruijie-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: error
