name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev nodejs npm

      - name: Clone Your Repository
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 强制修复 DTS 缺失（绝不浪费时间）==="
          DTS_DIR="target/linux/qualcommax/dts"
          TARGET_DTS="$DTS_DIR/ipq5018-ruijie_rg-ma3063.dts"
          
          # 创建目录
          mkdir -p $DTS_DIR
          
          # 打印一下你仓库里到底有什么 DTS
          echo "你仓库中现有的 DTS 文件如下:"
          ls -l $DTS_DIR/ | head -n 20
          
          # 暴力查找你之前成功上传的底包
          if [ -f "$DTS_DIR/ipq5018-rg-ma3063.dts" ]; then
            echo "找到你的原版文件 ipq5018-rg-ma3063.dts，正在强行复制..."
            cp "$DTS_DIR/ipq5018-rg-ma3063.dts" "$TARGET_DTS"
          elif [ -f "$DTS_DIR/ipq5018-cmcc_mr3000d-ci.dts" ]; then
            echo "找到 CMCC 文件，正在强行复制..."
            cp "$DTS_DIR/ipq5018-cmcc_mr3000d-ci.dts" "$TARGET_DTS"
          else
            # 如果上面的都没有，我们直接现场手写一个极简版的（保证能过编译）
            echo "没找到现成的，现场生成一个极简 DTS..."
            echo '/dts-v1/;' > "$TARGET_DTS"
            echo '#include "ipq5018.dtsi"' >> "$TARGET_DTS"
            echo '/ {' >> "$TARGET_DTS"
            echo '  model = "Ruijie RG-MA3063";' >> "$TARGET_DTS"
            echo '  compatible = "ruijie,rg-ma3063";' >> "$TARGET_DTS"
            echo '  memory@40000000 { device_type = "memory"; reg = <0x0 0x40000000 0x0 0x20000000>; };' >> "$TARGET_DTS"
            echo '  aliases { serial0 = &blsp1_uart1; };' >> "$TARGET_DTS"
            echo '  chosen { stdout-path = "serial0:115200n8"; };' >> "$TARGET_DTS"
            echo '};' >> "$TARGET_DTS"
          fi
          
          # 最后再检查一次，如果还没有，直接报错，绝不往下走！
          if [ ! -f "$TARGET_DTS" ]; then
            echo "❌ 严重错误：DTS 文件生成失败！"
            exit 1
          fi
          echo "✅ 搞定！DTS 文件已就绪: $TARGET_DTS"
          ls -l "$TARGET_DTS"

          echo "=== 锁定 Makefile ==="
          MK_FILE="target/linux/qualcommax/image/ipq50xx.mk"
          sed -i 's/DEVICE_DTS := .*/DEVICE_DTS := ipq5018-ruijie_rg-ma3063/' "$MK_FILE"
          
          echo "=== 生成 .config ==="
          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          make defconfig
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j1 V=s > build.log 2>&1 || true
          
          if ls bin/targets/qualcommax/ipq50xx/*ruijie_rg-ma3063*.bin 1> /dev/null 2>&1; then
            echo "✅ 编译成功！固件已生成。"
          else
            echo "❌ 编译失败，以下是最后 100 行日志："
            tail -n 100 build.log
            exit 1
          fi

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Ruijie-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: error
