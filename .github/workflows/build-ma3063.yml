name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone Your Custom OpenWrt Source
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt
          rm -rf .git 

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git || true

      - name: Configure Build
        run: |
          cd openwrt
          export ARCH=aarch64
          
          echo "=== 更新 feeds 并安装基础包 ==="
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 彻底清理旧配置 ==="
          rm -f .config

          echo "=== 优先锁定目标设备为锐捷 MA3063（防止被 CMCC 默认配置覆盖）==="
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          
          # 【关键】将 PROFILE 显式指向锐捷，并在同一行禁用 CMCC
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_ruijie_rg-ma3063\"" >> .config
          echo "# CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_mr3000d-ci is not set" >> .config

          echo "=== 生成配置 ==="
          make defconfig

          echo "=== 终极防御：检查是否真的选对设备 ==="
          if grep -q "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_cmcc_mr3000d-ci=y" .config; then
            echo "❌ 致命错误：系统依然选择了 CMCC 固件！"
            echo "以下是系统识别到的所有设备列表："
            grep "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_" .config | grep "=y"
            exit 1
          fi
          
          echo "✅ 成功锁定目标设备！"
          grep "CONFIG_TARGET_PROFILE" .config

          echo "=== 追加插件和主题配置 ==="
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config
          
          echo "=== 刷新配置（跳过递归依赖检查，避免 CMCC 被强制选回）==="
          make defconfig KCONFIG_SKIP_DEPENDENCY_CHECK=1
          
          echo "=== 预下载依赖包 ==="
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          export ARCH=aarch64
          echo "开始编译固件，这可能需要 1-3 小时..."
          make -j$(nproc) || make -j1 V=s
          
          echo "=== 打印生成的固件列表，让你看看究竟生成了什么 ==="
          ls -lh bin/targets/qualcommax/ipq50xx/

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-RG-MA3063-Firmware
          # 【关键修复】直接上传该目录下的所有文件，不再强制匹配名字！
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: warn
