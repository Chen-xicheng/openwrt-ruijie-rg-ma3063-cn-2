name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev nodejs npm

      - name: Clone Your Repository
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt

      - name: Clean Environment
        run: |
          cd openwrt
          # 彻底清理所有可能的残留目录
          make dirclean || true
          rm -rf build_dir staging_dir tmp

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 强制覆盖生成干净的 .config
          cat <<EOF > .config
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_TARGET_PROFILE="DEVICE_ruijie_rg-ma3063"
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF
          
          make defconfig
          # 下载所有依赖包，避免编译中途因下载失败中断
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          # -j1 单线程 + V=s 输出所有编译细节，并将日志保存，方便失败时直接读取
          make -j1 V=s > build.log 2>&1 || true
          
          if ls bin/targets/qualcommax/ipq50xx/*ruijie_rg-ma3063*.bin 1> /dev/null 2>&1; then
            echo "✅ 编译成功！固件已生成。"
          else
            echo "❌ 编译失败，以下是最后 150 行日志："
            tail -n 150 build.log
            exit 1
          fi

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Ruijie-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: error
