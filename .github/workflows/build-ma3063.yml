name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev nodejs npm

      - name: Clone Your Repository
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt

      - name: Fix DTS Path & Ensure Clean Build
        run: |
          cd openwrt
          echo "=== 步骤1: 自动查找并修正 DTS 文件路径 ==="
          
          MK_FILE="target/linux/qualcommax/image/ipq50xx.mk"
          OLD_DTS_BASE="ipq5018-ruijie_rg-ma3063"
          NEW_DTS_BASE="ipq5018-rg-ma3063" # 假设你仓库中的文件名为这个
          
          # 尝试查找仓库中实际的 DTS 文件（适配新旧两种路径）
          FOUND_DTS=$(find . -name "${OLD_DTS_BASE}.dts" -o -name "${NEW_DTS_BASE}.dts" | head -n 1)
          
          if [ -z "$FOUND_DTS" ]; then
            echo "❌ 错误：在仓库中未找到任何锐捷 MA3063 的 DTS 文件！"
            exit 1
          fi
          
          DTS_BASENAME=$(basename "$FOUND_DTS" .dts)
          echo "✅ 找到 DTS 文件: $FOUND_DTS，设备名为: $DTS_BASENAME"
          
          # 强制修正 Makefile 中的 DEVICE_DTS 设置
          sed -i "s|^  DEVICE_DTS :=.*|  DEVICE_DTS := $DTS_BASENAME|" "$MK_FILE"
          
          echo "=== 步骤2: 彻底清理所有构建缓存，确保纯净环境 ==="
          make dirclean || true
          rm -rf build_dir staging_dir tmp

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          make defconfig
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          # 使用单线程(-j1)编译，避免内存溢出，并记录完整日志
          make -j1 V=s > build.log 2>&1 || true
          
          if ls bin/targets/qualcommax/ipq50xx/*ruijie_rg-ma3063*.bin 1> /dev/null 2>&1; then
            echo "✅ 编译成功！固件已生成。"
          else
            echo "❌ 编译失败，以下是最后 150 行日志："
            tail -n 150 build.log
            exit 1
          fi

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Ruijie-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: error
