name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: 'OpenWrt commit hash to build against'
        required: true
        default: '486b4a4b3ede480635a185234fc624c969426f13'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
            rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout ${{ github.event.inputs.openwrt_commit || '486b4a4b3ede480635a185234fc624c969426f13' }}

      - name: Apply Device Patch
        run: |
          cd openwrt
          git apply ../patches/0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch

      - name: Configure Build
        run: |
          cd openwrt
          # 更新并安装 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 生成默认配置
          make defconfig
          
          # 设置目标平台和设备
          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          # 可根据需要添加其他软件包，例如中文语言包
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF
          
          # 确认设备配置是否已正确启用
          grep -q "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" .config || (echo "错误: 设备配置未正确设置!" && exit 1)

      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-ruijie-rg-ma3063-firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/
          retention-days: 5
