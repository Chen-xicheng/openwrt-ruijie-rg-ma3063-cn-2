name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: 'OpenWrt commit hash to build against'
        required: true
        default: '486b4a4b3ede480635a185234fc624c969426f13'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'
      - '**/*.patch'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 修复 Ubuntu 24.04 下 python3-distutils 缺失的问题
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip \
          rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout ${{ github.event.inputs.openwrt_commit || '486b4a4b3ede480635a185234fc624c969426f13' }}

      - name: Apply Device Patch
        run: |
          cd openwrt
          echo "=== 正在搜索仓库中的 .patch 文件 ==="
          PATCH_FILE=$(find .. -name "*.patch" -type f | head -n 1)
          if [ -z "$PATCH_FILE" ]; then
            echo "错误: 在仓库中未找到任何 .patch 文件，请确认文件已上传。"
            exit 1
          fi
          echo "找到补丁文件: $PATCH_FILE"
          echo "开始应用补丁..."
          git apply "$PATCH_FILE"

      # 将 Argon 主题克隆到 package 目录
      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF

          make defconfig

      # 如果你原来的代码中有编译步骤（如 make -j$(nproc)），请取消注释或替换为你的命令
      # - name: Compile Firmware
      #   run: |
      #     cd openwrt
      #     make -j$(nproc) || make -j1 V=s
