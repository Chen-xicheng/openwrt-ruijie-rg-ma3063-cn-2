name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: 'OpenWrt commit hash to build against'
        required: true
        # 建议使用 openwrt-24.10 分支的最新提交，或你确认可用的 commit
        default: 'openwrt-24.10' 
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    # 编译固件通常需要几个小时，防止 GitHub 默认超时导致失败
    timeout-minutes: 360 
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip \
          rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          # 【关键修改】如果输入是分支名（如 openwrt-24.10），则直接切换
          # 如果输入是 commit hash，则先切到该分支再 checkout
          INPUT_REF="${{ github.event.inputs.openwrt_commit }}"
          if [[ "$INPUT_REF" == openwrt-* ]]; then
            git checkout "$INPUT_REF"
          else
            # 默认尝试从 openwrt-24.10 分支切出指定 commit
            git checkout openwrt-24.10 2>/dev/null || true
            git checkout "$INPUT_REF" 2>/dev/null || { echo "Commit not found in openwrt-24.10, trying default branch..."; git checkout "$INPUT_REF"; }
          fi

      - name: Apply Device Patch or Copy Target
        run: |
          cd openwrt
          echo "=== 开始检查设备文件 ==="
          if [ -d "../patches" ] && [ "$(ls -A ../patches/*.patch 2>/dev/null)" ]; then
            echo "发现 patches 文件夹，准备应用补丁..."
            for patch in ../patches/*.patch; do
              echo "正在应用: $patch"
              git apply "$patch" || echo "补丁应用失败: $patch"
            done
          elif [ -d "../target" ]; then
            echo "未发现补丁，但发现了 target 文件夹，直接覆盖源码..."
            cp -r ../target ./
          else
            echo "警告: 既没有找到补丁文件，也没有找到 target 文件夹！请检查仓库文件是否完整。"
          fi
          echo "=== 设备文件处理完成 ==="

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

          cat >> .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF

          make defconfig
          
          # 下载编译所需的依赖包
          make download -j8

      # 【关键修改】在编译前强制清理，确保环境纯净
      - name: Clean before compile
        run: |
          cd openwrt
          make dirclean

      - name: Compile Firmware
        run: |
          cd openwrt
          echo "开始编译固件，这可能需要 1-3 小时..."
          # 使用所有核心进行编译，如果出错则使用单线程重新编译以显示详细错误信息
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-RG-MA3063-Firmware
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*.bin
            openwrt/bin/targets/qualcommax/ipq50xx/*.img
            openwrt/bin/targets/qualcommax/ipq50xx/*.itb
            openwrt/bin/targets/qualcommax/ipq50xx/*.manifest
          if-no-files-found: warn
