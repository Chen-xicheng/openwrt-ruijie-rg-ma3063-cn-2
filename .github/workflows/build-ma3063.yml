name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: 'OpenWrt commit hash to build against'
        required: true
        default: '486b4a4b3ede480635a185234fc624c969426f13'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout ${{ github.event.inputs.openwrt_commit }}

      - name: Apply Device Patch
        run: |
          cd openwrt
          echo "=== 寻找补丁文件 ==="
          if [ -f "../patches/0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch" ]; then
            PATCH_FILE="../patches/0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch"
          elif [ -f "../0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch" ]; then
            PATCH_FILE="../0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch"
          else
            PATCH_FILE=$(find .. -maxdepth 3 -name "*ruijie*ma3063*.patch" -type f | head -n 1)
          fi

          if [ -z "$PATCH_FILE" ]; then
            echo "❌ 严重错误：未找到设备补丁文件！"
            echo "请确认已将 0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch 上传至仓库的 patches/ 目录。"
            exit 1
          else
            echo "✅ 找到补丁: $PATCH_FILE"
            git apply "$PATCH_FILE"
          fi

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git

      - name: Configure Build
        run: |
          cd openwrt
          
          echo "=== 关键步骤: 在配置前强制设置 ARCH 环境变量 ==="
          export ARCH=aarch64
          
          echo "=== 更新 feeds 并安装基础包 ==="
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 生成基础配置 ==="
          make defconfig

          echo "=== 写入目标设备与架构配置 ==="
          echo 'CONFIG_TARGET_qualcommax=y' >> .config
          echo 'CONFIG_TARGET_qualcommax_ipq50xx=y' >> .config
          echo 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y' >> .config
          echo 'CONFIG_ARCH="aarch64"' >> .config
          echo 'CONFIG_TARGET_ARCH="aarch64"' >> .config

          echo "=== 再次执行 defconfig 使目标配置生效 ==="
          make defconfig

          echo "=== 追加插件和主题配置 ==="
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config

          echo "=== 最终刷新配置 ==="
          make defconfig
          
          echo "=== 预下载依赖包 ==="
          make download -j8

      - name: Clean before compile
        run: |
          cd openwrt
          make dirclean

      - name: Compile Firmware
        run: |
          cd openwrt
          export ARCH=aarch64
          echo "开始编译固件，这可能需要 1-3 小时..."
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-RG-MA3063-Firmware
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*.bin
            openwrt/bin/targets/qualcommax/ipq50xx/*.img
            openwrt/bin/targets/qualcommax/ipq50xx/*.itb
            openwrt/bin/targets/qualcommax/ipq50xx/*.manifest
          if-no-files-found: warn
