name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone Your Repository
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 动态注入锐捷设备定义（绝对不删任何原文件）==="
          MK_FILE="target/linux/qualcommax/image/ipq50xx.mk"
          DTS_DIR="target/linux/qualcommax/files/arch/arm64/boot/dts/qcom"
          if [ -d "target/linux/qualcommax/dts" ]; then
            DTS_DIR="target/linux/qualcommax/dts"
          fi

          # 1. 检查并追加 Makefile 定义
          if ! grep -q "Device/ruijie_rg-ma3063" "$MK_FILE"; then
            cat << 'EOF' >> "$MK_FILE"

define Device/ruijie_rg-ma3063
  DEVICE_VENDOR := Ruijie
  DEVICE_MODEL := RG-MA3063
  DEVICE_DTS := ipq5018-ruijie_rg-ma3063
  DEVICE_PACKAGES := $(DEVICE_PACKAGES_ipq50xx)
  IMAGE_SIZE := 40960k
  IMAGES := sysupgrade.bin factory.bin
  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
  IMAGE/factory.bin := append-ubi
endef
TARGET_DEVICES += ruijie_rg-ma3063
EOF
          fi

          # 2. 复制一个能用的 DTS 生成锐捷文件，避开你原有 DTS 的语法报错
          SRC_DTS="$DTS_DIR/ipq5018-mr3000d-ci.dts"
          if [ -f "$SRC_DTS" ]; then
            cp "$SRC_DTS" "$DTS_DIR/ipq5018-ruijie_rg-ma3063.dts"
            sed -i 's/model = ".*";/model = "Ruijie RG-MA3063";/' "$DTS_DIR/ipq5018-ruijie_rg-ma3063.dts"
            sed -i 's/compatible = ".*";/compatible = "ruijie,rg-ma3063";/' "$DTS_DIR/ipq5018-ruijie_rg-ma3063.dts"
          fi

          echo "=== 生成配置 ==="
          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_ruijie_rg-ma3063\"" >> .config

          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config

          make defconfig
          
          echo "=== 当前选中的编译设备 ==="
          grep "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_" .config | grep "=y"

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Ruijie-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: error
