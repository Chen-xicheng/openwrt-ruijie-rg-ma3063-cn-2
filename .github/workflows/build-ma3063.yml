name: Build OpenWrt for Ruijie RG-MA3063

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache flex gawk gettext git \
            libelf-dev libncurses5-dev libssl-dev python3 \
            python3-setuptools python3-dev rsync subversion \
            unzip wget xsltproc zlib1g-dev file curl bc

      - name: Checkout OpenWrt source
        run: |
          git clone --depth 1 \
            https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git \
            -b main openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inspect available packages
        run: |
          cd openwrt
          ./scripts/feeds list | grep -i ath11k || true
          ./scripts/feeds list | grep -i qcn6102 || true
          ./scripts/feeds list | grep -i qca-nss-dp || true
          ./scripts/feeds list | grep -i qca-ssdk || true

      - name: Generate .config
        run: |
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y

          CONFIG_DEVEL=y
          CONFIG_BUILDBOT=y
          CONFIG_CLEAN_IPKG=y
          CONFIG_IB=y
          CONFIG_IMAGEOPT=y
          CONFIG_SIGNATURE_CHECK=n

          # LuCI 中文
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y

          # ttyd
          CONFIG_PACKAGE_luci-app-ttyd=y

          # Argon 主题
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y

          # 高通 WiFi 驱动与固件（以 feeds 实际包名为准）
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_kmod-ath11k-ahb=y
          CONFIG_PACKAGE_ath11k-firmware-qcn6102=y

          # 高通有线/NSS 驱动（如果 feeds 里没有，make defconfig 会自动关掉）
          CONFIG_PACKAGE_kmod-qca-nss-dp=y
          CONFIG_PACKAGE_kmod-qca-ssdk=y
          EOF

          make defconfig

      - name: Ensure WiFi is enabled by default
        run: |
          cd openwrt

          # 优先使用 board.d 方式启用 WiFi
          BOARD_D=$(find target/linux/qualcommax -maxdepth 4 -name "99-default-wireless" -type f | head -n1)

          if [ -n "$BOARD_D" ]; then
            DIR=$(dirname "$BOARD_D")

            # 如果已经存在默认无线配置，就把 disabled 改成 0
            if grep -q "disabled" "$BOARD_D"; then
              sed -i "s/option[[:space:]]*disabled[[:space:]]*['\"]\?1['\"]\?/option disabled '0'/g" "$BOARD_D"
            else
              # 如果没有 disabled 字段，就追加启用 radio0 / radio1
              cat >> "$BOARD_D" <<'BD'

          uci set wireless.radio0.disabled='0' || true
          uci set wireless.radio1.disabled='0' || true
          BD
            fi

            echo "Patched board.d: $BOARD_D"
          else
            # 兜底：写入首次启动脚本，避免覆盖 network/wireless
            mkdir -p package/base-files/files/etc/uci-defaults

            cat > package/base-files/files/etc/uci-defaults/99-enable-wifi <<'UCI'
          #!/bin/sh
          uci set wireless.radio0.disabled='0' 2>/dev/null || true
          uci set wireless.radio1.disabled='0' 2>/dev/null || true
          uci commit wireless 2>/dev/null || true
          wifi reload 2>/dev/null || true
          exit 0
          UCI

            chmod +x package/base-files/files/etc/uci-defaults/99-enable-wifi
            echo "Created uci-defaults fallback to enable WiFi"
          fi

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Show build output
        run: |
          echo "=== Find firmware ==="
          ls -l openwrt/bin/targets/qualcommax/ipq50xx/ || true

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rg-ma3063-${{ github.run_number }}
          name: RG-MA3063 OpenWrt Build ${{ github.run_number }}
          body: |
            已加入：
            - LuCI 中文
            - luci-app-ttyd
            - luci-theme-argon + 中文
            - ath11k / ath11k-ahb / QCN6102 固件
            - qca-nss-dp / qca-ssdk（若 feeds 支持）
            - 默认启用 WiFi

            网口和底层硬件配置仍由源码仓库自带 DTS/board.d 决定，workflow 不再覆盖。
          files: |
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest
            openwrt/bin/targets/qualcommax/ipq50xx/sha256sums
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
