# ============================================================
# OpenWrt Build Workflow for Ruijie RG-MA3063
# ============================================================
# 基于仓库 Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2 的完整构建流程
# 已添加: luci、luci-i18n-base-zh-cn、luci-theme-argon、luci-i18n-argon-zh-cn、luci-app-ttyd
# 目标平台: qualcommax/ipq50xx (IPQ5018)
# 设备: rg_ma3063 (Ruijie RG-MA3063)
# 内核: 6.18
# ============================================================

name: Build RG-MA3063 Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 取消之前运行的工作流(避免队列堆积)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  TARGET_SUBTARGET: ipq50xx
  TARGET_DEVICE: rg_ma3063
  BUILD_DIR: ${{ github.workspace }}/build
  FEEDS_UPDATE: "true"

jobs:
  # ============================================================
  # Job 1: 构建固件
  # ============================================================
  build:
    name: Build Firmware (${{ matrix.target }}-${{ matrix.device }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: qualcommax
            subtarget: ipq50xx
            device: rg_ma3063

    steps:
      # --------------------------------------------------------
      # Step 1: 检出代码
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --------------------------------------------------------
      # Step 2: 设置环境变量
      # --------------------------------------------------------
      - name: Set build environment variables
        run: |
          echo "BUILD_DIR=${{ env.BUILD_DIR }}" >> $GITHUB_ENV
          echo "TARGET=${{ matrix.target }}" >> $GITHUB_ENV
          echo "SUBTARGET=${{ matrix.subtarget }}" >> $GITHUB_ENV
          echo "DEVICE=${{ matrix.device }}" >> $GITHUB_ENV
          echo "NPROC=$(nproc)" >> $GITHUB_ENV
          echo "BUILD_START=$(date +%s)" >> $GITHUB_ENV

      # --------------------------------------------------------
      # Step 3: 安装系统依赖
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            ccache \
            ecj \
            fastjar \
            java-propose-classpath \
            libelf-dev \
            patch \
            diffutils \
            autoconf \
            automake \
            libtool \
            libreadline-dev \
            pkg-config \
            zlib1g-dev \
            liblzma-dev \
            libzstd-dev \
            python3-distutils
          sudo apt-get clean
          df -h /

      # --------------------------------------------------------
      # Step 4: 配置Git
      # --------------------------------------------------------
      - name: Configure Git
        run: |
          git config --global user.email "ci@openwrt-build.local"
          git config --global user.name "CI Builder"
          git config --global advice.detachedHead false

      # --------------------------------------------------------
      # Step 5: 更新和安装Feeds
      # --------------------------------------------------------
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
        continue-on-error: true

      - name: Install feeds
        run: |
          ./scripts/feeds install -a
        continue-on-error: true


      # --------------------------------------------------------
      # Step 5a: 添加 Argon 主题 Feed
      # --------------------------------------------------------
      - name: Add Argon theme feed
        run: |
          # 添加 luci-theme-argon 第三方源
          echo "src-git argon https://github.com/jerrykuku/luci-theme-argon.git" >> feeds.conf
          # 更新 feeds 以获取新添加的源
          ./scripts/feeds update argon
          # 重新安装所有 feeds（包括新添加的 argon）
          ./scripts/feeds install -a
      # --------------------------------------------------------
      # Step 6: 生成默认配置
      # --------------------------------------------------------
      - name: Generate default config
        run: |
          make defconfig
        continue-on-error: true

      # --------------------------------------------------------
      # Step 7: 配置目标平台和设备
      # --------------------------------------------------------
      - name: Configure target and device
        run: |
          # 使用命令行方式设置配置选项
          # 启用 ipq50xx 目标
          echo "CONFIG_TARGET_IPQ50XX=y" >> .config
          # 启用 rg_ma3063 设备
          echo "CONFIG_TARGET_IPQ50XX_DEVICE_RG_MA3063=y" >> .config
          # 保留已有的其他配置
          make olddefconfig


      # --------------------------------------------------------
      # Step 7a: 启用 LuCI 插件、主题和中文
      # --------------------------------------------------------
      - name: Enable LuCI packages and Chinese language
        run: |
          echo "=== 启用 LuCI 及相关插件 ==="
          # 基础 LuCI 界面
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          # 简体中文语言包
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          # Argon 主题
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          # Argon 主题简体中文包
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          # TTYD 终端插件
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config
          echo "=== 重新整理配置 ==="
          make olddefconfig
      # --------------------------------------------------------
      # Step 8: 验证配置
      # --------------------------------------------------------
      - name: Verify configuration
        run: |
          echo "=== 验证构建配置 ==="
          grep "CONFIG_TARGET_IPQ50XX" .config || echo "WARNING: CONFIG_TARGET_IPQ50XX not set"
          grep "CONFIG_TARGET_IPQ50XX_DEVICE_RG_MA3063" .config || echo "WARNING: CONFIG_TARGET_IPQ50XX_DEVICE_RG_MA3063 not set"
          echo "=== 可用的 ipq50xx 设备 ==="
          grep "CONFIG_TARGET_IPQ50XX_DEVICE_" .config | grep -v "=n" | sort
          echo "=== 磁盘空间 ==="
          df -h /

      # --------------------------------------------------------
      # Step 9: 下载包
      # --------------------------------------------------------
      - name: Download packages
        run: |
          make download -j$(nproc) DOWNLOAD_ONLY=1
        continue-on-error: true

      # --------------------------------------------------------
      # Step 10: 编译固件
      # --------------------------------------------------------
      - name: Build firmware
        run: |
          echo "开始编译..."
          echo "使用 $(nproc) 个并行任务"
          make -j$(nproc) || make -j1 V=s
        env:
          CCACHE_COMPILERCHECK: "%compiler% -dumpversion; %compiler% -dumpmachine"
          CCACHE_BASEDIR: "${{ github.workspace }}"

      # --------------------------------------------------------
      # Step 11: 收集输出文件
      # --------------------------------------------------------
      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          # 复制固件输出目录
          if [ -d "bin/targets/${TARGET_SUBTARGET}" ]; then
            cp -r bin/targets/${TARGET_SUBTARGET} artifacts/
            echo "=== 固件文件列表 ==="
            find artifacts/ -type f | head -50
          else
            echo "WARNING: bin/targets/${TARGET_SUBTARGET} not found"
            find bin/ -type f 2>/dev/null | head -30
          fi
          if [ -f "build_dir/target-*/linux-*/.compiled" ]; then
            echo "编译成功标记文件存在"
          fi

      # --------------------------------------------------------
      # Step 12: 上传构建产物
      # --------------------------------------------------------
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RG-MA3063-firmware-${{ github.sha }}
          path: |
            artifacts/
            bin/
          retention-days: 14
          if-no-files-found: warn

      # --------------------------------------------------------
      # Step 13: 上传构建日志(失败时)
      # --------------------------------------------------------
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RG-MA3063-build-logs-${{ github.sha }}
          path: |
            build_dir/
            logs/
          retention-days: 7

  # ============================================================
  # Job 2: 创建 GitHub Release (仅手动触发或标签推送)
  # ============================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: RG-MA3063-firmware-${{ github.sha }}
          path: firmware/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: RG-MA3063 Firmware ${{ github.ref_name }}
          files: firmware/**/*
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
