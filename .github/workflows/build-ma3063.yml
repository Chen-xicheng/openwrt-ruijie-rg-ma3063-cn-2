name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone Your Custom OpenWrt Source
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt
          rm -rf .git

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git || true

      - name: Configure Build
        run: |
          cd openwrt
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 修复 DTS 文件中的宏定义与节点引用 ==="
          DTS_DIR="target/linux/qualcommax/files/arch/arm64/boot/dts/qcom"
          DTS_FILE="$DTS_DIR/ipq5018-ruijie-rg-ma3063.dts"

          # 1. 复制一个已知可用的 DTS 作为基础模板
          if [ -f "$DTS_DIR/ipq5018-spnmx56.dts" ]; then
            cp "$DTS_DIR/ipq5018-spnmx56.dts" "$DTS_FILE"
          elif [ -f "$DTS_DIR/ipq5018-mr3000d-ci.dts" ]; then
            cp "$DTS_DIR/ipq5018-mr3000d-ci.dts" "$DTS_FILE"
          fi

          # 2. 确保包含了宏定义头文件
          if ! grep -q 'qcom-ipq-ess.h' "$DTS_FILE"; then
            sed -i '1i #include <dt-bindings/net/qcom-ipq-ess.h>' "$DTS_FILE"
          fi

          # 3. 修正 model 和 compatible 属性
          sed -i 's/model = ".*";/model = "Ruijie RG-MA3063";/' "$DTS_FILE"
          sed -i 's/compatible = ".*";/compatible = "ruijie,rg-ma3063";/' "$DTS_FILE"

          # 4. 确保 switch、dp1、dp2 节点存在（如果模板中没有，则从其他文件补充）
          # 这里依赖模板文件本身包含这些节点，如果模板文件缺失，则需要手动定义

          echo "=== 生成配置文件 ==="
          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_ruijie_rg-ma3063\"" >> .config

          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config

          make defconfig
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          export ARCH=aarch64
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: warn
