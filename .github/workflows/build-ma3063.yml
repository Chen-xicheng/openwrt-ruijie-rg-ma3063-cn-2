name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone Your Custom OpenWrt Source
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt
          rm -rf .git

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git || true

      - name: Configure Build
        run: |
          cd openwrt
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 动态定位并适配 DTS 设备定义 ==="
          MK_FILE="target/linux/qualcommax/image/ipq50xx.mk"
          DTS_DIR="target/linux/qualcommax/files/arch/arm64/boot/dts/qcom"
          if [ -d "target/linux/qualcommax/dts" ]; then
            DTS_DIR="target/linux/qualcommax/dts"
          fi

          TARGET_DEV="ruijie_rg-ma3063"
          SRC_DEV="cmcc_mr3000d-ci"
          if grep -q "ruijie_rg-ma3063" "$MK_FILE"; then
            TARGET_DEV="ruijie_rg-ma3063"
          else
            sed -i 's/cmcc_mr3000d-ci/ruijie_rg-ma3063/g' "$MK_FILE"
            sed -i 's/CMCC MR3000D-CI/Ruijie RG-MA3063/g' "$MK_FILE"
          fi

          if [ -f "$DTS_DIR/ipq5018-mr3000d-ci.dts" ]; then
            cp "$DTS_DIR/ipq5018-mr3000d-ci.dts" "$DTS_DIR/ipq5018-ruijie-rg-ma3063.dts"
            sed -i 's/model = "CMCC MR3000D-CI"/model = "Ruijie RG-MA3063"/g' "$DTS_DIR/ipq5018-ruijie-rg-ma3063.dts"
            sed -i 's/compatible = "cmcc,mr3000d-ci"/compatible = "ruijie,rg-ma3063"/g' "$DTS_DIR/ipq5018-ruijie-rg-ma3063.dts"
          fi

          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_${TARGET_DEV}=y" >> .config
          echo "CONFIG_TARGET_PROFILE=\"DEVICE_${TARGET_DEV}\"" >> .config

          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config

          make defconfig
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          export ARCH=aarch64
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: warn
