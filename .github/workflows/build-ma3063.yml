name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev nodejs npm

      - name: Clone Your Repository
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 彻底废除旧 DTS，强行生成纯净极简版 ==="
          DTS_DIR="target/linux/qualcommax/dts"
          mkdir -p $DTS_DIR
          
          TARGET_DTS="$DTS_DIR/ipq5018-ruijie_rg-ma3063.dts"
          OLD_DTS="$DTS_DIR/ipq5018-rg-ma3063.dts"
          
          # 强行生成一个没有任何网络节点的纯净 DTS，绝对不报错
          echo '/dts-v1/;' > "$TARGET_DTS"
          echo '#include "ipq5018.dtsi"' >> "$TARGET_DTS"
          echo '' >> "$TARGET_DTS"
          echo '/ {' >> "$TARGET_DTS"
          echo '  model = "Ruijie RG-MA3063";' >> "$TARGET_DTS"
          echo '  compatible = "ruijie,rg-ma3063";' >> "$TARGET_DTS"
          echo '' >> "$TARGET_DTS"
          echo '  memory@40000000 {' >> "$TARGET_DTS"
          echo '    device_type = "memory";' >> "$TARGET_DTS"
          echo '    reg = <0x0 0x40000000 0x0 0x20000000>;' >> "$TARGET_DTS"
          echo '  };' >> "$TARGET_DTS"
          echo '' >> "$TARGET_DTS"
          echo '  aliases {' >> "$TARGET_DTS"
          echo '    serial0 = &blsp1_uart1;' >> "$TARGET_DTS"
          echo '  };' >> "$TARGET_DTS"
          echo '' >> "$TARGET_DTS"
          echo '  chosen {' >> "$TARGET_DTS"
          echo '    stdout-path = "serial0:115200n8";' >> "$TARGET_DTS"
          echo '    bootargs-append = "root=/dev/ubiblock0_0 rootwait";' >> "$TARGET_DTS"
          echo '  };' >> "$TARGET_DTS"
          echo '};' >> "$TARGET_DTS"
          echo '' >> "$TARGET_DTS"
          echo '&blsp1_uart1 {' >> "$TARGET_DTS"
          echo '  status = "okay";' >> "$TARGET_DTS"
          echo '};' >> "$TARGET_DTS"
          
          # 如果存在你之前的错误文件，直接清空，防止它被意外调用
          if [ -f "$OLD_DTS" ]; then
            echo "" > "$OLD_DTS"
          fi
          
          echo "✅ 纯净版 DTS 已生成："
          cat "$TARGET_DTS"

          echo "=== 强行修改 Makefile 指向新文件 ==="
          MK_FILE="target/linux/qualcommax/image/ipq50xx.mk"
          sed -i 's/DEVICE_DTS := .*/DEVICE_DTS := ipq5018-ruijie_rg-ma3063/' "$MK_FILE"
          
          echo "=== 生成 .config ==="
          rm -f .config
          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          
          make defconfig
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j1 V=s > build.log 2>&1 || true
          
          if ls bin/targets/qualcommax/ipq50xx/*ruijie_rg-ma3063*.bin 1> /dev/null 2>&1; then
            echo "✅ 编译成功！固件已生成。"
          else
            echo "❌ 编译失败，以下是最后 100 行日志："
            tail -n 100 build.log
            exit 1
          fi

      - name: Upload Firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Ruijie-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: error
