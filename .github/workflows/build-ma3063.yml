name: Build OpenWrt for Ruijie RG-MA3063

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache flex gawk gettext git \
            libelf-dev libncurses5-dev libssl-dev python3 \
            python3-setuptools python3-dev rsync subversion \
            unzip wget xsltproc zlib1g-dev file curl bc

      - name: Checkout OpenWrt source
        run: |
          git clone --depth 1 \
            https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git \
            -b main openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

            - name: Generate .config
        run: |
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          
          CONFIG_DEVEL=y
          CONFIG_BUILDBOT=y
          CONFIG_CLEAN_IPKG=y
          CONFIG_IB=y
          CONFIG_IMAGEOPT=y
          CONFIG_SIGNATURE_CHECK=n
          
          # --- 基础组件 ---
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_libc=y

          # --- IPQ50XX 核心高通原生驱动 ---
          # 这些是 IPQ5018 必须的高通底层驱动
          CONFIG_PACKAGE_kmod-qca-nss-dp=y
          CONFIG_PACKAGE_kmod-qca-ssdk=y
          CONFIG_PACKAGE_kmod-qca-qmi-wwan=n

          # --- 正确的 WiFi 驱动（高通 QCA 系列）---
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_kmod-ath11k-ahb=y
          CONFIG_PACKAGE_ath11k-firmware-qcn6122=y
          # 启用 WPA/WPA2/WPA3 认证和 WiFi 热点生成服务
          CONFIG_PACKAGE_hostapd-common=y
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_wireless-regdb=y

          # --- 网络管理（DHCP/DNS/防火墙）---
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_ip6tables-mod-nat=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y

          # --- 常用插件与主题 ---
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-ssr-plus=y
          CONFIG_PACKAGE_luci-app-vssr=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filetransfer=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-app-mwan3=y
          CONFIG_PACKAGE_luci-app-turboacc=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y

          EOF
          make defconfig

      - name: Inject wireless and network config
        run: |
          cd openwrt
          # 创建 wireless 配置文件目录
          mkdir -p target/linux/qualcommax/ipq50xx/base-files/etc/config/
          
          # 写入 wireless 配置
          cat > target/linux/qualcommax/ipq50xx/base-files/etc/config/wireless <<'WIRELESS_EOF'
# Copyright (C) 2016 OpenWrt.org
#
# Configuration for Ruijie RG-MA3063 (IPQ5018)

config wifi-device 'radio0'
	option type 'mac80211'
	option channel '6'
	option hwmode '11g'
	option htmode 'HT20'
	option country 'CN'
	option disabled '0'
	option maxassoc '32'

config wifi-iface 'radio0_ap'
	option device 'radio0'
	option network 'lan'
	option mode 'ap'
	option ssid 'OpenWrt-MA3063-2.4G'
	option encryption 'psk2'
	option key 'openwrt123'
	option maxassoc '32'
	option wmm '1'

config wifi-device 'radio1'
	option type 'mac80211'
	option channel '36'
	option hwmode '11a'
	option htmode 'VHT160'
	option country 'CN'
	option disabled '0'
	option maxassoc '32'

config wifi-iface 'radio1_ap'
	option device 'radio1'
	option network 'lan'
	option mode 'ap'
	option ssid 'OpenWrt-MA3063-5G'
	option encryption 'psk2'
	option key 'openwrt123'
	option maxassoc '32'
	option wmm '1'
WIRELESS_EOF

          # 写入 network 配置
          cat > target/linux/qualcommax/ipq50xx/base-files/etc/config/network <<'NETWORK_EOF'
# Copyright (C) 2014 OpenWrt.org
#
# Network configuration for Ruijie RG-MA3063

config interface 'loopback'
	option ifname 'lo'
	option proto 'static'
	option ipaddr '127.0.0.1'
	option netmask '255.0.0.0'

config globals 'globals'
	option ula_prefix 'fd8c:XXXX:XXXX::/48'

config interface 'lan'
	option type 'bridge'
	option ifname 'br-lan'
	option proto 'static'
	option ipaddr '192.168.1.1'
	option netmask '255.255.255.0'
	option ip6assign '60'

config interface 'wan'
	option ifname 'wan'
	option proto 'dhcp'

config interface 'wan6'
	option ifname 'wan'
	option proto 'dhcpv6'
NETWORK_EOF

          # 写入 dhcp/dnsmasq 配置
          cat > target/linux/qualcommax/ipq50xx/base-files/etc/config/dhcp <<'DHCP_EOF'
# DHCP/Dnsmasq configuration for Ruijie RG-MA3063

config dnsmasq
    option domainneeded '1'
    option boguspriv '1'
    option filterwin2k '0'
    option localise_queries '1'
    option rebind_protection '1'
    option rebind_localhost '1'
    option local '/lan/'
    option domain 'lan'
    option expandhosts '1'
    option nonegcache '0'
    option authoritative '1'
    option leasefile '/tmp/dhcp.leases'
    option resolvefile '/tmp/resolv.conf.auto'
    option nonwildcard '1'
    option localservice '1'

config dhcp 'lan'
    option interface 'lan'
    option start '100'
    option limit '150'
    option lease '12h'
    option dhcpv4 'server'
    option dhcpv6 'server'
    option ra 'server'
    option ra_slaac '1'

config dhcp 'wan'
    option interface 'wan'
    option ignore '1'

config odhcpd 'odhcpd'
    option maindhcp '0'
    option leasefile '/tmp/hosts/odhcpd'
    option leasetrigger '/usr/sbin/odhcpd-update'
    option loglevel '4'
DHCP_EOF

          echo "Config files injected successfully"
          ls -la target/linux/qualcommax/ipq50xx/base-files/etc/config/

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Show build output
        run: |
          echo "=== Find firmware ==="
          ls -l openwrt/bin/targets/qualcommax/ipq50xx/ || true
          echo "=== Check for firmware files ==="
          find openwrt/bin/targets/qualcommax/ipq50xx/ -type f -name "*.bin" -o -name "*.ubi" -o -name "*.itb" -o -name "*.manifest" -o -name "sha256sums" 2>/dev/null

      - name: Create SHA256 checksums
        run: |
          cd openwrt
          cd bin/targets/qualcommax/ipq50xx/ || true
          if [ -f openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin ]; then
            sha256sum openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin \
                      openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi \
                      openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb \
                      openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest > sha256sums 2>/dev/null || true
          fi

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rg-ma3063-${{ github.run_number }}
          name: RG-MA3063 OpenWrt Build ${{ github.run_number }}
          body: 自动编译生成，包含 sysupgrade.bin 与 factory.ubi
          files: |
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063.manifest
            openwrt/bin/targets/qualcommax/ipq50xx/sha256sums
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
