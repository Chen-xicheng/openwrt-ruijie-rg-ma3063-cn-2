name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: 'OpenWrt commit hash to build against'
        required: true
        default: 'openwrt-24.10'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          INPUT_REF="${{ github.event.inputs.openwrt_commit }}"
          if [[ "$INPUT_REF" == openwrt-* ]]; then
            git checkout "$INPUT_REF"
          else
            git checkout openwrt-24.10 2>/dev/null || true
            git checkout "$INPUT_REF" 2>/dev/null || { echo "Commit not found in openwrt-24.10, trying default branch..."; git checkout "$INPUT_REF"; }
          fi

      - name: Apply Device Patch or Copy Target
        run: |
          cd openwrt
          echo "=== 开始检查设备文件 ==="
          if [ -d "../patches" ] && [ "$(ls -A ../patches/*.patch 2>/dev/null)" ]; then
            echo "发现 patches 文件夹，准备应用补丁..."
            for patch in ../patches/*.patch; do
              echo "正在应用: $patch"
              git apply "$patch" || echo "补丁应用失败: $patch"
            done
          elif [ -d "../target" ]; then
            echo "未发现补丁，但发现了 target 文件夹，直接覆盖源码..."
            cp -r ../target ./
          else
            echo "警告: 既没有找到补丁文件，也没有找到 target 文件夹！请检查仓库文件是否完整。"
          fi
          echo "=== 设备文件处理完成 ==="

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

          echo "=== 补全 aarch64 架构的 site 配置文件 ==="
          if [ ! -f "include/site/aarch64" ]; then
            mkdir -p include/site
            echo '#!/bin/sh' > include/site/aarch64
            echo '. $TOPDIR/include/site/linux' >> include/site/aarch64
            echo 'ac_cv_c_littleendian=${ac_cv_c_littleendian=yes}' >> include/site/aarch64
            echo 'ac_cv_c_bigendian=${ac_cv_c_bigendian=no}' >> include/site/aarch64
            echo 'ac_cv_sizeof___int64=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_char=1' >> include/site/aarch64
            echo 'ac_cv_sizeof_int=4' >> include/site/aarch64
            echo 'ac_cv_sizeof_int16_t=2' >> include/site/aarch64
            echo 'ac_cv_sizeof_int32_t=4' >> include/site/aarch64
            echo 'ac_cv_sizeof_int64_t=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_long_int=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_long_long=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_long=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_off_t=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_short_int=2' >> include/site/aarch64
            echo 'ac_cv_sizeof_short=2' >> include/site/aarch64
            echo 'ac_cv_sizeof_size_t=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_ssize_t=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_u_int16_t=2' >> include/site/aarch64
            echo 'ac_cv_sizeof_u_int32_t=4' >> include/site/aarch64
            echo 'ac_cv_sizeof_u_int64_t=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_uint16_t=2' >> include/site/aarch64
            echo 'ac_cv_sizeof_uint32_t=4' >> include/site/aarch64
            echo 'ac_cv_sizeof_uint64_t=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_unsigned_int=4' >> include/site/aarch64
            echo 'ac_cv_sizeof_unsigned_long=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_unsigned_long_long=8' >> include/site/aarch64
            echo 'ac_cv_sizeof_unsigned_short=2' >> include/site/aarch64
            echo 'ac_cv_sizeof_void_p=8' >> include/site/aarch64
          fi

          echo "=== 追加目标平台及插件配置 ==="
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

          make defconfig
          make download -j8

      - name: Clean before compile
        run: |
          cd openwrt
          make dirclean

      - name: Compile Firmware
        run: |
          cd openwrt
          echo "开始编译固件，这可能需要 1-3 小时..."
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-RG-MA3063-Firmware
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*.bin
            openwrt/bin/targets/qualcommax/ipq50xx/*.img
            openwrt/bin/targets/qualcommax/ipq50xx/*.itb
            openwrt/bin/targets/qualcommax/ipq50xx/*.manifest
          if-no-files-found: warn
