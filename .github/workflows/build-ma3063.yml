name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: 'OpenWrt commit hash to build against'
        required: true
        default: 'openwrt-24.10'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          INPUT_REF="${{ github.event.inputs.openwrt_commit }}"
          if [[ "$INPUT_REF" == openwrt-* ]]; then
            git checkout "$INPUT_REF"
          else
            git checkout openwrt-24.10 2>/dev/null || true
            git checkout "$INPUT_REF" 2>/dev/null || { echo "Commit not found in openwrt-24.10, trying default branch..."; git checkout "$INPUT_REF"; }
          fi

      - name: Apply Device Patch or Copy Target
        run: |
          cd openwrt
          echo "=== 开始检查设备文件 ==="
          if [ -d "../patches" ] && [ "$(ls -A ../patches/*.patch 2>/dev/null)" ]; then
            echo "发现 patches 文件夹，准备应用补丁..."
            for patch in ../patches/*.patch; do
              echo "正在应用: $patch"
              git apply "$patch" || echo "补丁应用失败: $patch"
            done
          elif [ -d "../target" ]; then
            echo "未发现补丁，但发现了 target 文件夹，直接覆盖源码..."
            cp -r ../target ./
          else
            echo "警告: 既没有找到补丁文件，也没有找到 target 文件夹！请检查仓库文件是否完整。"
          fi
          echo "=== 设备文件处理完成 ==="

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git

      - name: Configure Build
        run: |
          cd openwrt

          echo "=== 从官方源码获取 aarch64 site 文件 ==="
          # 从 OpenWrt 官方源码库获取对应版本的 aarch64 配置文件
          wget -O include/site/aarch64 "https://raw.githubusercontent.com/openwrt/openwrt/openwrt-24.10/include/site/aarch64"
          chmod +x include/site/aarch64
          echo "文件已下载，检查内容前几行："
          head -5 include/site/aarch64

          echo "=== 设置 ARCH 环境变量 ==="
          export ARCH=aarch64

          echo "=== 更新 feeds ==="
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 写入基础目标配置 ==="
          echo 'CONFIG_TARGET_qualcommax=y' > .config
          echo 'CONFIG_TARGET_qualcommax_ipq50xx=y' >> .config
          echo 'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y' >> .config

          echo "=== 生成默认配置 ==="
          make defconfig

          echo "=== 追加插件和主题 ==="
          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config

          echo "=== 刷新配置 ==="
          make defconfig

          echo "=== 预下载依赖包 ==="
          make download -j8

      - name: Clean before compile
        run: |
          cd openwrt
          make dirclean

      - name: Compile Firmware
        run: |
          cd openwrt
          export ARCH=aarch64
          echo "开始编译固件，这可能需要 1-3 小时..."
          make -j$(nproc) || make -j1 V=s

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-RG-MA3063-Firmware
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*.bin
            openwrt/bin/targets/qualcommax/ipq50xx/*.img
            openwrt/bin/targets/qualcommax/ipq50xx/*.itb
            openwrt/bin/targets/qualcommax/ipq50xx/*.manifest
          if-no-files-found: warn
