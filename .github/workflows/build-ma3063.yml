name: Build OpenWrt Firmware for Ruijie RG-MA3063
on:
  workflow_dispatch:
    inputs:
      openwrt_commit:
        description: 'OpenWrt commit hash to build against'
        required: true
        default: '486b4a4b3ede480635a185234fc624c969426f13' # 用户原代码中的 commit
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip \
          rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout ${{ github.event.inputs.openwrt_commit || '486b4a4b3ede480635a185234fc624c969426f13' }}

      - name: Apply Device Patch
        run: |
          cd openwrt
          # 打印出上一级目录 patches 文件夹的内容，方便在日志中查看真实文件名
          echo "检查补丁文件目录:"
          ls -l ../patches/ || echo "警告: 找不到 ../patches/ 目录"
          
          # 【注意】请将下方的文件名替换为你仓库中真实存在的文件名！
          # 如果报错，请查看上方打印的目录内容。
          git apply ../patches/0001-qualcommax-ipq50xx-add-ruijie-rg-ma3063.patch

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git

      - name: Configure Build
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

          # 保留你原有的配置，并追加所需插件和主题
          # 注意：如果你原有的 .config 还有其他内容，请确保不会被覆盖
          cat >> .config <<EOF
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF
