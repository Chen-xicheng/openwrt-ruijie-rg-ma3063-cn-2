name: Build OpenWrt Firmware for Ruijie RG-MA3063

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-ma3063.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-dev python3-setuptools python3-pip rsync subversion swig time xsltproc zlib1g-dev

      - name: Clone Your Custom OpenWrt Source
        run: |
          git clone https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn-2.git openwrt
          cd openwrt
          rm -rf .git 

      - name: Clone Argon Theme
        run: |
          cd openwrt/package
          git clone https://github.com/jerrykuku/luci-theme-argon.git || true

      - name: Configure Build
        run: |
          cd openwrt
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          rm -f .config

          # 自动搜索源码里是否存在锐捷的设备定义
          DEV_NAME=$(grep "define Device/" target/linux/qualcommax/image/ipq50xx.mk | grep -i -E "ruijie|ma3063" | awk -F'/' '{print $2}' | awk '{print $1}' | head -n 1)
          
          if [ -z "$DEV_NAME" ]; then
            echo "未找到锐捷定义，强制重命名 CMCC 为锐捷"
            sed -i 's/define Device\/cmcc_mr3000d-ci/define Device\/ruijie_rg-ma3063/' target/linux/qualcommax/image/ipq50xx.mk
            sed -i 's/TARGET_DEVICES += cmcc_mr3000d-ci/TARGET_DEVICES += ruijie_rg-ma3063/' target/linux/qualcommax/image/ipq50xx.mk
            sed -i 's/CMCC MR3000D-CI/Ruijie RG-MA3063/g' target/linux/qualcommax/image/ipq50xx.mk
            DEV_NAME="ruijie_rg-ma3063"
          fi
          
          echo "当前编译的设备名称: $DEV_NAME"

          echo "CONFIG_TARGET_qualcommax=y" > .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_${DEV_NAME}=y" >> .config

          echo 'CONFIG_PACKAGE_luci=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-theme-argon=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config

          make defconfig
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          export ARCH=aarch64
          echo "开始编译固件，这可能需要 1-3 小时..."
          make -j$(nproc) || make -j1 V=s
          
          echo "=== 打印生成的固件列表，让你看看究竟生成了什么 ==="
          ls -lh bin/targets/qualcommax/ipq50xx/

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Firmware
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: error
