name: Build MA3063 Firmware

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720 # 12小时超时，防止编译大插件时超时

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache flex gawk gettext git \
            libelf-dev libncurses5-dev libssl-dev python3 \
            python3-setuptools python3-dev rsync subversion \
            unzip wget xsltproc zlib1g-dev file curl bc

      - name: Checkout OpenWrt source
        run: |
          git clone --depth 1 \
            https://github.com/Chen-xicheng/openwrt-ruijie-rg-ma3063-cn.git \
            -b main openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config (Add Plugins & Chinese)
        run: |
          cd openwrt
          cat > .config <<EOF
          # --- 基础系统配置 ---
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_ruijie_rg-ma3063=y
          CONFIG_DEVEL=y
          CONFIG_BUILDBOT=y
          CONFIG_CLEAN_IPKG=y
          CONFIG_IB=y
          CONFIG_IMAGEOPT=y
          CONFIG_SIGNATURE_CHECK=n

          # --- 中文支持 (LuCI Chinese) ---
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          # 如果你想用 Argon 主题，可以取消下面注释（需源码支持）
          # CONFIG_PACKAGE_luci-theme-argon=y
          # CONFIG_PACKAGE_luci-i18n-argon-zh-cn=y

          # --- 常用插件 (Plugins) ---
          # 网络工具
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-ssr-plus=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-vssr=y
          
          # 下载与存储
          CONFIG_PACKAGE_luci-app-aria2=y
          CONFIG_PACKAGE_luci-app-transmission=y
          CONFIG_PACKAGE_luci-app-samba4=y
          
          # 系统工具
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filetransfer=y
          CONFIG_PACKAGE_luci-app-wol=y
          
          # 监控与流量
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_luci-app-smartdns=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          
          EOF
          
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: Show build output
        run: |
          echo "=== Find firmware ==="
          ls -l openwrt/bin/targets/qualcommax/ipq50xx/ || true

      - name: Release firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ma3063-build-${{ github.run_number }}
          name: RG-MA3063 Build ${{ github.run_number }} (With Plugins)
          body: |
            自动编译生成，包含常用插件与中文界面。
            **包含插件：** PassWall, SSR+, OpenClash, Aria2, Docker, Samba4 等。
          files: |
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-squashfs-factory.ubi
            openwrt/bin/targets/qualcommax/ipq50xx/openwrt-qualcommax-ipq50xx-ruijie_rg-ma3063-initramfs-uImage.itb
            openwrt/bin/targets/qualcommax/ipq50xx/sha256sums
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
